name: secret scan

# Runs on every push and pull request. Two independent scanners, because they
# fail differently: gitleaks knows hundreds of provider formats, and the local
# script knows this repository's own placeholder conventions. A finding from
# either one fails the run.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history, so an old commit is caught too
      - name: Scan history and working tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-scan:
    name: repository scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan every tracked file
        run: python3 tools/scan-secrets.py
